<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ANTI-CACHE TAGS -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Select Delivery Location - Da Aloo</title>

    <!-- Force HTTPS Redirect -->
    <script>
        if (window.location.protocol === 'http:' && !window.location.hostname.includes('localhost')) {
            window.location.href = 'https://' + window.location.hostname + window.location.pathname + window.location.search;
        }
    </script>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #FDFD96;
            --primary-dark: #E6B800;
            --secondary: #000000;
            --background: #FFF9C4;
            --card: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--background);
            color: var(--secondary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .location-container {
            background-color: white;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        .location-header {
            background: var(--primary);
            color: #2C2D2D;
            padding: 1.5rem;
            border-radius: 15px 15px 0 0;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .location-header h2 {
            margin: 0;
            font-family: 'Bebas Neue', cursive;
            font-size: 3.5rem;
            letter-spacing: 1px;
        }

        .location-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 1.8rem;
            font-weight: 700;
            color: #00000;
            text-align: center;
            padding: 10px 20px;
            margin: 0;
            width: 100%;
        }

        .location-status i {
            font-size: 2rem;
            color: #25D366;
        }

        .location-status.warning {
            color: #FF9800;
            background: #FFF3E0;
            border-radius: 10px;
            border: 2px solid #FF9800;
            padding: 12px 20px;
        }

        .location-status.warning i {
            color: #FF9800;
        }

        /* NEW: outlet info display */
        .outlet-info {
            background: #e8f5e9;
            border-left: 4px solid #25D366;
            padding: 10px 15px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 0.95rem;
            display: none;
        }
        .outlet-info strong {
            color: #1b5e20;
        }

        #map {
            height: 250px;
            width: 100%;
            border-radius: 8px;
            margin: 15px 0;
            border: 2px solid #f0f0f0;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .map-loading {
            text-align: center;
            color: #666;
        }
        .map-loading i {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #000000;
        }

        .location-instructions {
            background: #f8f9fa;
            padding: 12px 15px;
            border-radius: 8px;
            border-left: 3px solid var(--primary);
            margin: 15px 0;
            font-size: 0.9rem;
        }
        .location-instructions i {
            color: var(--secondary);
            margin-right: 8px;
        }

        .location-footer {
            padding: 1rem 1.5rem;
            display: flex;
            border-top: 2px solid #eee;
            background: #f8f9fa;
        }

        .confirm-btn {
            width: 100%;
            padding: 1.2rem 1.5rem;
            background: #25D366;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1.2rem;
            min-height: 60px;
            transition: background 0.3s, transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .confirm-btn:hover {
            background: #1ebe57;
            transform: translateY(-2px);
        }
        .confirm-btn:active {
            transform: translateY(0);
        }

        .leaflet-control-zoom {
            border: 2px solid var(--secondary) !important;
        }
        .leaflet-control-zoom a {
            background: var(--primary) !important;
            color: var(--secondary) !important;
            border: 1px solid var(--secondary) !important;
        }
        .leaflet-control-zoom a:hover {
            background: var(--secondary) !important;
            color: var(--primary) !important;
        }

        @media (max-width: 768px) {
            .location-container { width: 95%; max-height: 95vh; }
            .location-header h2 { font-size: 1.8rem; }
            #map { height: 200px; }
            .location-status { font-size: 1.15rem; padding: 8px 16px; }
            .location-status i { font-size: 1.8rem; }
            .confirm-btn { padding: 1rem 1.2rem; font-size: 1.1rem; min-height: 55px; }
        }
        @media (max-width: 480px) {
            body { padding: 10px; }
            .location-header h2 { font-size: 1.6rem; }
            #map { height: 180px; }
            .location-status { font-size: 1.05rem; padding: 6px 12px; gap: 8px; }
            .location-status i { font-size: 1.7rem; }
            .confirm-btn { padding: 0.9rem 1rem; font-size: 1rem; min-height: 50px; }
        }
    </style>
</head>

<body>
    <div class="location-container">
        <div class="location-header">
            <div class="location-status" id="locationStatus">
                <i class="fas fa-spinner fa-spin"></i>
                <span>Checking location...</span>
            </div>
        </div>

        <!-- Outlet info display (hidden by default) -->
        <div class="outlet-info" id="outletInfo">
            <i class="fas fa-store"></i>
            <span>Nearest outlet: <strong id="outletName">—</strong> (approx. <span id="outletDistance">—</span> km)</span>
        </div>

        <div id="map">
            <div class="map-loading">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Getting your location...</p>
            </div>
        </div>

        <div class="location-instructions">
            <p><i class="fas fa-info-circle"></i> Drag the marker to choose delivery location other than your live location.</p>
        </div>

        <div class="location-footer">
            <button class="confirm-btn" id="confirmLocationBtn">
                <i class="fab fa-whatsapp fa-1x"></i> Order on WhatsApp
            </button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ================================================================
        //  OUTLET DATA – UPDATE WITH YOUR ACTUAL BRANCHES
        // ================================================================
        const outlets = [
            {
                id: 'natole',
                name: 'Natole Branch',
                lat: 27.674942433423965,
                lng: 85.31855658411457,
                phone: '9779847375984',        // without '+'
                address: 'Natole, Kathmandu'
            },
            {
                id: 'manbhawan',
                name: 'Manbhawan Branch',
                lat: 27.667721113264086,
                lng: 85.31808451534287,
                phone: '9779747843416',        // without '+'
                address: 'Manbhawan, Lalitpur'
            }
        ];

        // ================================================================
        //  HELPER FUNCTIONS
        // ================================================================
        function getDistance(lat1, lng1, lat2, lng2) {
            const R = 6371; // Earth's radius in km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function findNearestOutlet(lat, lng) {
            let nearest = outlets[0];
            let minDist = Infinity;
            for (const outlet of outlets) {
                const dist = getDistance(lat, lng, outlet.lat, outlet.lng);
                if (dist < minDist) {
                    minDist = dist;
                    nearest = outlet;
                }
            }
            return { outlet: nearest, distance: minDist };
        }

        // ================================================================
        //  GLOBALS & STATE
        // ================================================================
        let map, marker, cart = [];
        let isLiveLocation = false;
        let hasMarkerBeenDragged = false;
        const defaultLocation = { lat: 27.7172, lng: 85.3240 }; // Kathmandu (fallback)

        // Load cart from localStorage
        try {
            const savedCart = localStorage.getItem('daAlooCart');
            cart = savedCart ? JSON.parse(savedCart) : [];
        } catch (e) {
            console.error('Error loading cart:', e);
        }

        // ================================================================
        //  UI UPDATE FUNCTIONS
        // ================================================================
        function updateLocationStatus(isLive) {
            const statusElement = document.getElementById('locationStatus');
            const icon = statusElement.querySelector('i');
            const textSpan = statusElement.querySelector('span');

            if (isLive) {
                statusElement.className = 'location-status';
                icon.className = 'fas fa-check-circle';
                textSpan.textContent = 'Your Live location is selected';
            } else {
                statusElement.className = 'location-status warning';
                icon.className = 'fas fa-exclamation-triangle';
                textSpan.textContent = 'Turn on Location Setting on your device';
            }
        }

        function showNearestOutlet(lat, lng) {
            const result = findNearestOutlet(lat, lng);
            const outlet = result.outlet;
            const dist = result.distance.toFixed(2);

            const infoDiv = document.getElementById('outletInfo');
            document.getElementById('outletName').textContent = outlet.name;
            document.getElementById('outletDistance').textContent = dist;
            infoDiv.style.display = 'block';

            // Also update status text to show outlet name
            const statusSpan = document.querySelector('#locationStatus span');
            if (statusSpan) {
                statusSpan.textContent = `📍 Nearest: ${outlet.name} (${dist} km)`;
                document.querySelector('#locationStatus i').className = 'fas fa-store';
            }
        }

        // ================================================================
        //  MAP INITIALISATION
        // ================================================================
        function initMap(latitude, longitude, isLive) {
            document.getElementById('map').innerHTML = '';
            map = L.map('map').setView([latitude, longitude], 16);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            marker = L.marker([latitude, longitude], {
                draggable: true,
                icon: L.icon({
                    iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
                    iconSize: [25, 41],
                    iconAnchor: [12, 41]
                })
            }).addTo(map);

            marker.bindPopup('Drag me to adjust location').openPopup();

            // Track marker drag
            marker.on('dragend', function () {
                hasMarkerBeenDragged = true;
                const pos = marker.getLatLng();
                // Update nearest outlet display
                showNearestOutlet(pos.lat, pos.lng);
                // Update status to indicate manual selection
                const statusSpan = document.querySelector('#locationStatus span');
                if (statusSpan) {
                    statusSpan.textContent = '📍 Location set manually';
                }
            });

            isLiveLocation = isLive;

            // Show nearest outlet for this initial position
            showNearestOutlet(latitude, longitude);
        }

        // ================================================================
        //  GET USER LOCATION (with fallback)
        // ================================================================
        function getUserLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve({ latitude: defaultLocation.lat, longitude: defaultLocation.lng, isLive: false });
                    return;
                }

                let resolved = false;
                const success = (position) => {
                    if (resolved) return;
                    resolved = true;
                    navigator.geolocation.clearWatch(watchId);
                    resolve({
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude,
                        isLive: true
                    });
                };

                const error = () => {
                    if (!resolved) {
                        navigator.geolocation.clearWatch(watchId);
                        resolve({ latitude: defaultLocation.lat, longitude: defaultLocation.lng, isLive: false });
                    }
                };

                const watchId = navigator.geolocation.watchPosition(success, error, {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 15000
                });

                setTimeout(() => {
                    if (!resolved) {
                        navigator.geolocation.clearWatch(watchId);
                        resolve({ latitude: defaultLocation.lat, longitude: defaultLocation.lng, isLive: false });
                    }
                }, 15000);
            });
        }

        // ================================================================
        //  ORDER MESSAGE FORMATTING (unchanged, but uses dynamic phone)
        // ================================================================
        function formatOrderMessage(locationLink, locationText, outlet) {
            let message = "*My ORDER*\n\n*Order Details:*\n";

            const now = new Date();
            message += `Date: ${now.toLocaleDateString()} ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}\n\n`;

            let grandTotal = 0;

            if (cart.length === 0) {
                message += "No items in cart\n";
            } else {
                cart.forEach(item => {
                    let lineTotal;
                    if (item.totalPrice !== undefined) {
                        lineTotal = item.totalPrice;
                    } else if (item.price !== undefined) {
                        lineTotal = item.price * (item.quantity || 1);
                    } else {
                        lineTotal = 0;
                    }
                    grandTotal += lineTotal;

                    message += `• ${item.quantity || 1}x ${item.name}`;
                    if (item.variant) {
                        message += ` (${item.variant.name})`;
                    }
                    if (item.extras && item.extras.length > 0) {
                        message += `\n   - Extras: ${item.extras.map(extra => extra.name).join(', ')}`;
                    }
                    if (item.details) {
                        message += `\n   _Items: ${item.details}_`;
                    }
                    message += `\n   - Rs ${lineTotal}\n\n`;
                });
            }

            message += `*Total Amount: Rs ${grandTotal}*\n\n*Delivery Location:* ${locationText}`;
            if (locationLink !== "No location sent") {
                message += `\n${locationLink}`;
            }
            // Append nearest outlet info for reference
            message += `\n\n*Nearest Outlet:* ${outlet.name} (${outlet.address})`;
            message += `\n\nPlease confirm this order.\nThank you!`;
            return message;
        }

        // ================================================================
        //  SEND ORDER – now uses nearest outlet dynamically
        // ================================================================
        function sendOrderToWhatsApp() {
            if (!marker) {
                alert('Map is still loading. Please wait...');
                return;
            }

            if (!cart.length) {
                alert('Your cart is empty! Please add items first.');
                return;
            }

            // Get final marker position
            const pos = marker.getLatLng();
            const userLat = pos.lat;
            const userLng = pos.lng;

            // Find nearest outlet
            const result = findNearestOutlet(userLat, userLng);
            const nearest = result.outlet;
            const distance = result.distance;

            // Build location text & link based on whether location is live or dragged
            let locationText = "";
            let locationLink = "";

            // If live location and marker hasn't been dragged => use live coordinates
            if (isLiveLocation && !hasMarkerBeenDragged) {
                locationLink = `https://www.google.com/maps?q=${userLat.toFixed(6)},${userLng.toFixed(6)}`;
                locationText = "Live Location";
            } else if (!isLiveLocation && !hasMarkerBeenDragged) {
                // No live location and not dragged -> no location sent (fallback)
                locationText = "No location sent - User did not select location";
                locationLink = "No location sent";
            } else {
                // Marker dragged -> use its position
                locationLink = `https://www.google.com/maps?q=${userLat.toFixed(6)},${userLng.toFixed(6)}`;
                locationText = "Selected Location (dragged)";
            }

            // Format message with nearest outlet info
            const message = formatOrderMessage(locationLink, locationText, nearest);
            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/${nearest.phone}?text=${encodedMessage}`;

            // Clear cart
            localStorage.removeItem('daAlooCart');

            // Open WhatsApp
            window.open(whatsappUrl, '_blank');

            // Redirect back after a moment
            setTimeout(() => {
                const returnPage = localStorage.getItem('daAlooOrigin') || 'index.html';
                window.location.href = returnPage;
            }, 2000);
        }

        // ================================================================
        //  INIT ON PAGE LOAD
        // ================================================================
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const location = await getUserLocation();
                updateLocationStatus(location.isLive);
                initMap(location.latitude, location.longitude, location.isLive);
            } catch (error) {
                console.error('Failed to initialize map:', error);
                updateLocationStatus(false);
                initMap(defaultLocation.lat, defaultLocation.lng, false);
            }

            document.getElementById('confirmLocationBtn').addEventListener('click', sendOrderToWhatsApp);
        });
    </script>
</body>
</html>
